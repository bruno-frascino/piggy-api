name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Lint, test, build, context:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --run

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Build
        run: yarn build

      - name: Verify context/ is up to date
        run: yarn context:check
